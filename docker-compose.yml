services:
  api:
    build: .
    container_name: agent-manager-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:sqlite:data/agent-manager.db
      SERVER_PORT: 8080
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3-32b}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.7}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-1024}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MINIMAX_TEMPERATURE: ${MINIMAX_TEMPERATURE:-0.7}
      MINIMAX_MAX_TOKENS: ${MINIMAX_MAX_TOKENS:-1024}
    volumes:
      - ./data:/app/data
