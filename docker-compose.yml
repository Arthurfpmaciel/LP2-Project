services:
  api:
    build: .
    container_name: agent-manager-api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:sqlite:data/agent-manager.db
      SERVER_PORT: 8080
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3-32b}
      GROQ_TEMPERATURE: ${GROQ_TEMPERATURE:-0.7}
      GROQ_MAX_TOKENS: ${GROQ_MAX_TOKENS:-1024}
    volumes:
      - ./data:/app/data
