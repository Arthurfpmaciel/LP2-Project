spring.application.name=agent-manager

spring.datasource.url=${DATABASE_URL:jdbc:sqlite:data/agent-manager.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.mapper.accept-case-insensitive-enums=true

server.port=${SERVER_PORT:8080}

# Selecao de provedor LLM: groq | minimax. Default: groq
llm.provider=${LLM_PROVIDER:groq}

# Groq
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:qwen/qwen3-32b}
groq.temperature=${GROQ_TEMPERATURE:0.7}
groq.max-tokens=${GROQ_MAX_TOKENS:1024}

# MiniMax
minimax.base-url=${MINIMAX_BASE_URL:https://api.minimax.io/v1}
minimax.api-key=${MINIMAX_API_KEY:}
minimax.model=${MINIMAX_MODEL:MiniMax-M3}
minimax.temperature=${MINIMAX_TEMPERATURE:0.7}
minimax.max-tokens=${MINIMAX_MAX_TOKENS:1024}